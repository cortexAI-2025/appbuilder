name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Format de sortie'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      sign_release:
        description: 'Signer l'artifact (Release)'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Project (Smart Detection)
        run: |
          mkdir -p extraction_tmp
          if [ -f "project.zip" ]; then
            unzip -q project.zip -d extraction_tmp
            echo "🔍 Recherche du cœur du projet Android..."
            CANDIDATES=$(find extraction_tmp -type f -name "gradlew" -exec dirname {} \;)
            VALID_ROOT=""
            for dir in $CANDIDATES; do
              if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
                VALID_ROOT=$dir
                break
              fi
            done
            if [ -z "$VALID_ROOT" ]; then
              VALID_ROOT=$(find extraction_tmp -type f -name "gradlew" -exec dirname {} \; | head -n 1)
            fi
            if [ -n "$VALID_ROOT" ]; then
              echo "✅ Racine trouvée : $VALID_ROOT"
              cp -r "$VALID_ROOT"/* .
            else
              echo "❌ Aucun gradlew trouvé dans le ZIP"
              exit 1
            fi
          else
            echo "⚠️ project.zip non trouvé, utilisation des fichiers du repo"
          fi
          chmod +x gradlew
          rm -rf extraction_tmp

      - name: Build with Gradle
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "apk" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew bundleRelease
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: android-build-result
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          retention-days: 7
