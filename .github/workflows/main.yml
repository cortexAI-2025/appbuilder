name: Build Android APK/AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Format de sortie'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
      sign_release:
        description: "Signer l'artifact (Release)"
        required: false
        default: false
        type: boolean
      repo_url:
        description: 'URL du Repository GitHub'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: "Build Android"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      OUTPUT_DIR:   ${{ github.workspace }}/android_working_dir/output
      WORK_DIR:     ${{ github.workspace }}/android_working_dir/build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-sdk
          key: android-sdk-34-${{ runner.os }}-v2
          restore-keys: |
            android-sdk-34-${{ runner.os }}-
            android-sdk-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Clone Project
        if: github.event.inputs.repo_url != ''
        run: |
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          git clone --depth 1 "${{ github.event.inputs.repo_url }}" "$WORK_DIR"
          echo "PROJECT_CLONED=true" >> $GITHUB_ENV

      - name: Run build pipeline
        id: build_pipeline
        run: |
          mkdir -p "$OUTPUT_DIR"

          KEYSTORE_PATH="${{ secrets.KEYSTORE_PATH || '' }}" \
          KEYSTORE_ALIAS="${{ secrets.KEYSTORE_ALIAS || '' }}" \
          KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS || '' }}" \
          KEY_PASS="${{ secrets.KEY_PASS || '' }}" \
          bash scripts/build.sh "${{ github.event.inputs.repo_url }}" 2>&1 | tee "$OUTPUT_DIR/pipeline.log" || true

          # Capture JSON result
          python3 -c "
          import sys, json, re, os
          log_path = os.path.join(os.environ['OUTPUT_DIR'], 'pipeline.log')
          if not os.path.exists(log_path):
              print('BUILD_STATUS=FAILED')
              sys.exit(0)
          text = open(log_path).read()
          matches = re.findall(r'\{[^{}]*\"status\"[^{}]*\}', text, re.S)
          if matches:
              try:
                  obj = json.loads(matches[-1])
                  print('BUILD_STATUS=' + obj.get('status','FAILED'))
              except:
                  print('BUILD_STATUS=FAILED')
          else:
              print('BUILD_STATUS=FAILED')
          " >> $GITHUB_ENV

      - name: Debug - List workspace files
        run: |
          echo "Listing all files in workspace for debugging..."
          ls -R . | head -n 200

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-result
          path: |
            android_working_dir/output/*.apk
            android_working_dir/output/*.aab
            android_working_dir/output/*.log
          retention-days: 7
          if-no-files-found: warn

      - name: Check build result
        run: |
          if [[ "${BUILD_STATUS}" == "FAILED" ]]; then
            echo "Build FAILED — check logs for details."
            exit 1
          fi
