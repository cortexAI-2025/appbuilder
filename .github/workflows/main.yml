        name: Build Android APK-AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Format de sortie (apk ou aab)"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab

jobs:
  build:
    name: "Compilation Android"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Debug - Liste des fichiers au depart
        run: |
          echo "Vérification de la racine du repo :"
          ls -lh
          file project.zip

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Preparation et Extraction
        run: |
          mkdir -p extraction_tmp
          unzip -o project.zip -d extraction_tmp
          
          echo "🔍 Contenu trouvé dans le ZIP :"
          ls -R extraction_tmp
          
          # Recherche de la racine du projet
          ROOT_DIR=$(find extraction_tmp -type f -name "gradlew" -exec dirname {} \; | head -n 1)
          
          if [ -n "$ROOT_DIR" ]; then
            echo "✅ Racine détectée : $ROOT_DIR"
            cp -r "$ROOT_DIR"/* .
            chmod +x gradlew
          else
            echo "❌ ERREUR : Aucun fichier gradlew trouvé dans project.zip"
            exit 1
          fi

      - name: Build avec Gradle
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "apk" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew bundleRelease
          fi

      - name: Exportation des Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-result
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
