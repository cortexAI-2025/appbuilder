          name: Build Android APK-AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Format de sortie (apk ou aab)"
        required: true
        default: "apk"
        type: choice
        options:
          - apk
          - aab
      sign_release:
        description: "Activer la signature"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: "Compilation Android"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Cache désactivé pour éviter l'erreur de détection au démarrage

      - name: Preparation du Projet
        run: |
          mkdir -p extraction_tmp
          if [ -f "project.zip" ]; then
            unzip -q project.zip -d extraction_tmp
            echo "Searching for Android project root..."
            CANDIDATES=$(find extraction_tmp -type f -name "gradlew" -exec dirname {} \;)
            VALID_ROOT=""
            for dir in $CANDIDATES; do
              if [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ]; then
                VALID_ROOT=$dir
                break
              fi
            done
            if [ -z "$VALID_ROOT" ]; then
              VALID_ROOT=$(find extraction_tmp -type f -name "gradlew" -exec dirname {} \; | head -n 1)
            fi
            if [ -n "$VALID_ROOT" ]; then
              echo "Root found: $VALID_ROOT"
              cp -r "$VALID_ROOT"/* .
            else
              echo "No gradlew found in ZIP"
              exit 1
            fi
          else
            echo "project.zip not found, using repo files"
          fi
          chmod +x gradlew
          rm -rf extraction_tmp

      - name: Build avec Gradle
        run: |
          if [ "${{ github.event.inputs.build_type }}" == "apk" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew bundleRelease
          fi

      - name: Exportation des Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build-result
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/bundle/**/*.aab
          retention-days: 7
